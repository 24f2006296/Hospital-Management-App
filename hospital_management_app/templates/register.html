<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>


<body>
    <div class="form-container">
    <h1>Register</h1>
    <form method="POST" action="{{ url_for('register') }}">
        <label for="full_name">Full Name:</label><br>
        <input type="text" id="full_name" name="name" required><br><br>
        
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirm_password">Confirm Password:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required><br><br>


        <label for="email">E-mail ID:</label><br>
        <input type="email" id="email" name="email" required><br><br>


        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" pattern="^\+?[0-9]{10,13}$" maxlength="13" placeholder="+91 9846170351" title="Enter with +91" required><br><br>

        <button type="submit">Register</button>
    </form>

    <div class="links">
        <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        <a href="{{ url_for('home') }}" class="back-btn">← Back to Home</a>
    </div>
    </div>
    
</body>
</html>
