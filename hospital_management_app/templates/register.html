<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>

<style>
    .container2 {
        width: 300px;
        margin: 100px auto;
        padding: 30px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
        color: rgb(18, 126, 241);
    }
    form {
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: 0 auto;
    }
    label {
        display: block;
        margin-bottom: 5px;
    }
    input[type="text"], input[type="password"], input[type="email"], input[type="number"], input[type="tel"], select {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 3px;
    }
    button {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }
    button:hover {
        background-color: #218838;
    }
</style>
<body class="container2">
    <h1>Register</h1>
    <from method="Post" action="/register">
        <label for="full_name">Full Name:</label><br>
        <input type="text" id="full_name" name="username" required><br><br>
        
        <label for="username_r">Username:</label><br>
        <input type="text" id="username_r" name="username" required><br><br>

        <label for="password_r">Password:</label><br>
        <input type="password" id="password_r" name="password" required><br><br>

        <label for="confirm_password">Confirm Password:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required><br><br>


        <label for="email">E-mail ID:</label><br>
        <input type="email" id="email" name="email" required><br><br>


        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="0" required><br><br>


        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" pattern="[0-9+\- ]{7,15}" required><br><br>

        <label for="role">Role:</label><br>
        <select id ="role" name="role" required>
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
            
        </select>


        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a></p>



    
</body>
</html>
